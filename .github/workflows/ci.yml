name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        compiler: [g++, clang++]
        exclude:
          - os: windows-latest
            compiler: clang++
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (${{ matrix.compiler }})
    steps:
      - uses: actions/checkout@v4
      
      - name: Install clang (Linux only)
        if: runner.os == 'Linux' && matrix.compiler == 'clang++'
        run: sudo apt-get update && sudo apt-get install -y clang
      
      - name: Build all
        run: cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} && cmake --build build
      
      - name: Run hello_world
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            ./build/hello_world_application/Debug/hello_world.exe
          else
            ./build/hello_world_application/hello_world
          fi
        shell: bash
      
      - name: Run solver
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            echo "1 -5 6" | ./build/solver_application/Debug/solver.exe
          else
            echo "1 -5 6" | ./build/solver_application/solver
          fi
        shell: bash

